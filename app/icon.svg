<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="50%" stop-color="#090c12" />
      <stop offset="100%" stop-color="#040507" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Emerald Flow Gradient (Top Ribbon) -->
    <linearGradient id="emeraldFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan/Blue Flow Gradient (Bottom Ribbon) -->
    <linearGradient id="cyanBlueFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows for 3D Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Dark Canvas with Rounded Squircle -->
  <rect 
    x="16" 
    y="16" 
    width="480" 
    height="480" 
    rx="112" 
    fill="url(#bgGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="6"
  />

  <!-- Ambient Light Halo behind Monogram -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)" />

  <!-- Architectural Circuit Grid Accents (Subtle) -->
  <g opacity="0.12" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <circle cx="256" cy="256" r="120" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 8" />
  </g>

  <!-- High-Precision Angular Hex-S Monogram (Crisp & Modern) -->
  <g id="architectural-s" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper Stream Pipeline -->
    <path 
      d="M 364 164 
         L 220 164 
         A 44 44 0 0 0 176 208 
         L 176 216 
         A 44 44 0 0 0 220 260 
         L 292 260 
         A 44 44 0 0 1 336 304 
         L 336 312 
         A 44 44 0 0 1 292 356 
         L 148 356" 
      fill="none" 
      stroke="url(#cyanBlueFlow)" 
      stroke-width="48" 
      filter="url(#glow)"
    />

    <!-- Overlapping Emerald Highlight Vector -->
    <path 
      d="M 364 164 
         L 220 164 
         A 44 44 0 0 0 176 208 
         L 176 216 
         A 44 44 0 0 0 220 260 
         L 292 260" 
      fill="none" 
      stroke="url(#emeraldFlow)" 
      stroke-width="48" 
    />

    <!-- Realtime Pulse Nodes (Telemetry Vertices) -->
    <!-- Start Node -->
    <circle cx="364" cy="164" r="14" fill="#ffffff" />
    <circle cx="364" cy="164" r="7" fill="#10b981" />

    <!-- Center Junction Node -->
    <circle cx="256" cy="260" r="12" fill="#ffffff" />
    <circle cx="256" cy="260" r="6" fill="#06b6d4" />

    <!-- Terminal Node -->
    <circle cx="148" cy="356" r="14" fill="#ffffff" />
    <circle cx="148" cy="356" r="7" fill="#3b82f6" />
  </g>

  <!-- Technical Corner Marks (Systems Engineering Precision) -->
  <path d="M 52 92 L 52 52 L 92 52" fill="none" stroke="#10b981" stroke-width="3" opacity="0.4" />
  <path d="M 460 92 L 460 52 L 420 52" fill="none" stroke="#10b981" stroke-width="3" opacity="0.4" />
  <path d="M 52 420 L 52 460 L 92 460" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.4" />
  <path d="M 460 420 L 460 460 L 420 460" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.4" />
</svg>
